name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'e2e/**'
      - 'docs/**'
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to test when called by another workflow
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Syntax check
        run: python -m compileall src/ tests/ -q

      - name: Smoke tests
        run: pytest -q

      - name: Vercel gateway tests
        run: node --test tests/vercel_gateway.test.js

      - name: Vehicle catalogue behavioral tests
        run: node --test tests/test_fitment_vehicle_catalogue_behavior.mjs
