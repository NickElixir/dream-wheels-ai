name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'fix/**'
      - 'e2e/**'
      - 'docs/**'
      - 'chore/**'
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to test when called by another workflow
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Strict release workflow lint (actionlint 1.7.12)
        run: |
          lint_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$lint_dir/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$lint_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck= -pyflakes= \
            .github/workflows/ci.yml \
            .github/workflows/deploy-frontends.yml \
            .github/workflows/ru-release.yml \
            .github/workflows/frontend-release-preflight.yml
          rm -rf "$lint_dir"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install frontend test dependencies
        run: npm ci --prefix webapp

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Syntax check
        run: python -m compileall src/ tests/ -q

      - name: Smoke tests
        run: pytest -q

      - name: Vercel gateway tests
        run: node --test tests/vercel_gateway.test.js

      - name: Vehicle catalogue behavioral tests
        run: node --test tests/test_fitment_vehicle_catalogue_behavior.mjs

      - name: Fitment navigation behavioral tests
        run: node --test tests/test_fitment_transition_behavior.mjs

      - name: Fitment composition and focus tests
        run: node --test tests/test_fitment_vnext_composition.mjs tests/test_fitment_vnext_focus.mjs tests/test_form_focus.mjs tests/test_startup.mjs tests/test_e01_i18n.mjs tests/test_e01_corrective.mjs tests/test_source_extract.mjs

      - name: Failed render behavioral tests
        run: node --test tests/test_failed_render_behavior.mjs tests/test_create_draft_metadata.mjs

      - name: Webapp boot behavior tests
        run: node --test tests/test_webapp_boot_behavior.mjs

      - name: Webapp auth harness tests
        run: npm --prefix webapp test

      - name: Webapp auth harness bundle
        run: npm --prefix webapp run build && git diff --exit-code -- webapp/auth/harness.bundle.js webapp/auth/app-auth.bundle.js

      - name: Timeweb static builder tests
        run: node --test deploy/timeweb-static/build.test.mjs

      - name: RU release verifier tests
        run: node --test scripts/verify_ru_release.test.mjs

      - name: Timeweb release orchestration tests
        run: python scripts/test_timeweb_release.py

      - name: Deno gateway checks and tests
        working-directory: deploy/gateway
        run: deno task check

  qa-context-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify disposable QA setup on isolated PostgreSQL
        env:
          TEST_FITMENT_QA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q tests/test_fitment_qa_tooling.py

      - name: Verify Vehicle confirmation persistence and rollback on isolated PostgreSQL
        env:
          TEST_VEHICLE_CONFIRMATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q tests/test_vehicle_confirmation_provenance.py tests/test_fitment_variant_details.py

      - name: Verify payment timeout, late callbacks and credit races on isolated PostgreSQL
        env:
          TEST_PAYMENT_LIFECYCLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q tests/test_payment_lifecycle_postgres.py

      - name: Verify render finality and accounting on isolated PostgreSQL
        env:
          TEST_RENDER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q tests/test_render_finality_postgres.py

      - name: Verify account try-on numbering on isolated PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q tests/test_try_on_numbers_postgres.py

      - name: Verify permanent legacy credit cutover on isolated PostgreSQL
        env:
          TEST_CREDIT_CUTOVER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q tests/test_legacy_credit_cutover_postgres.py
