name: Deploy Frontends

# Staging publishes automatically; production is an intentional, backend-gated release.
# Vercel-native Git deployments must stay disabled per project.
on:
  push:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      target:
        description: Intentional deployment target (production requires verified backend)
        type: choice
        options: [preview, production]
        default: preview
        required: true
      deploy_admin:
        description: Also deploy the reviewed admin artifact in this production release
        type: boolean
        default: false
        required: true
      ref:
        description: Preview ref, or exact current-main ref for production
        required: true
        default: staging
        type: string
      run_e2e:
        description: Leave a handoff marker for authenticated E2E after preview deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vercel-frontend-${{ inputs.target == 'production' && 'production' || inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 53.1.1
  STAGING_BACKEND_URL: https://dream-wheels-ai-robokassa-staging.onrender.com
  PRODUCTION_BACKEND_URL: https://dream-wheels-ai-prod-vnext.onrender.com

jobs:
  ci:
    name: CI gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'production' && inputs.ref || github.sha }}
    permissions:
      contents: read

  deploy-staging:
    name: Deploy staging frontend
    needs: ci
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Verify staging project environment before build
        # Vercel project settings own the webapp/admin Root Directory. Running
        # the CLI from a subdirectory would resolve it twice (for example,
        # webapp/webapp) during a prebuilt deployment.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_STAGING_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          vercel whoami --token="$VERCEL_TOKEN" | sed 's/^/Vercel token identity: /'
          inventory_file="$(mktemp)"
          vercel env ls production --token="$VERCEL_TOKEN" > "$inventory_file"
          if awk 'NR > 2 { print $1 }' "$inventory_file" | grep -Fxq "BACKEND_URL"; then
            inventory_state="listed"
          else
            inventory_state="not_listed"
          fi
          rm -f "$inventory_file"
          echo "Vercel production environment inventory: BACKEND_URL=$inventory_state"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          env_file=".vercel/.env.production.local"
          test -f "$env_file"
          actual_backend="$(sed -n 's/^BACKEND_URL=//p' "$env_file" | tr -d '"' | tr -d "'")"
          if [ -n "$actual_backend" ]; then
            echo "Pulled production environment: BACKEND_URL=present"
          else
            echo "Pulled production environment: BACKEND_URL=absent"
          fi
          rm -f "$env_file"
          if [ "$actual_backend" != "$STAGING_BACKEND_URL" ]; then
            case "$actual_backend" in
              "")
                if [ "$inventory_state" = "listed" ]; then
                  diagnostic="listed_but_not_pulled"
                else
                  diagnostic="missing"
                fi
                ;;
              "$PRODUCTION_BACKEND_URL") diagnostic="points_to_production" ;;
              "$STAGING_BACKEND_URL"/) diagnostic="trailing_slash" ;;
              *) diagnostic="other" ;;
            esac
            echo "staging BACKEND_URL mismatch: $diagnostic; refusing deployment" >&2
            exit 1
          fi

      - name: Stamp webapp build metadata
        run: |
          build_sha="$(git rev-parse HEAD)"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i "s/__BUILD_ID__/$build_sha/g" webapp/index.html
          printf '{\n  "build": "%s",\n  "built_at": "%s"\n}\n' "$build_sha" "$built_at" > webapp/version.json

      - name: Build staging artifact
        env:
          EXPECTED_SUPABASE_URL: https://hnawojlnfoaccinlgjyn.supabase.co
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_STAGING_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exactly one staging artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_STAGING_PROJECT_ID }}
        run: |
          output="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify staging alias and backend health
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://dream-wheels-ai-webapp-staging.vercel.app/api/backend/health"

  verify-production-backend:
    name: Verify production backend release
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin current main and verify matching backend
        id: release
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          test "$REQUESTED_REF" = "$DISPATCH_SHA"
          git fetch origin main
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$(git rev-parse origin/main)"
          python3 scripts/check_release_backend.py "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production frontend
    needs: [ci, verify-production-backend]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify-production-backend.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Verify production project environment before build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_PRODUCTION_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          env_file=".vercel/.env.production.local"
          test -f "$env_file"
          actual_backend="$(sed -n 's/^BACKEND_URL=//p' "$env_file" | tr -d '"' | tr -d "'")"
          rm -f "$env_file"
          test "$actual_backend" = "$PRODUCTION_BACKEND_URL" || {
            echo "production BACKEND_URL missing or mismatched; refusing deployment" >&2
            exit 1
          }

      - name: Stamp webapp build metadata
        run: |
          build_sha="$(git rev-parse HEAD)"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i "s/__BUILD_ID__/$build_sha/g" webapp/index.html
          printf '{\n  "build": "%s",\n  "built_at": "%s"\n}\n' "$build_sha" "$built_at" > webapp/version.json

      - name: Build production artifact
        env:
          EXPECTED_SUPABASE_URL: https://qmgyccghsbdpehiybjae.supabase.co
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_PRODUCTION_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exactly one production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_PRODUCTION_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

  deploy-admin:
    name: Deploy admin when explicitly selected
    needs: [ci, verify-production-backend]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production' && github.ref_name == 'main' && inputs.deploy_admin
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify-production-backend.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Build admin artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ADMIN_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exactly one admin artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ADMIN_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

  deploy-preview:
    name: Manual preview deployment
    needs: ci
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'production'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Verify preview environment before build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_STAGING_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          env_file=".vercel/.env.preview.local"
          test -f "$env_file"
          actual_backend="$(sed -n 's/^BACKEND_URL=//p' "$env_file" | tr -d '"' | tr -d "'")"
          rm -f "$env_file"
          test "$actual_backend" = "$STAGING_BACKEND_URL" || {
            echo "preview BACKEND_URL mismatch; refusing deployment" >&2
            exit 1
          }

      - name: Stamp webapp build metadata
        run: |
          build_sha="$(git rev-parse HEAD)"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i "s/__BUILD_ID__/$build_sha/g" webapp/index.html
          printf '{\n  "build": "%s",\n  "built_at": "%s"\n}\n' "$build_sha" "$built_at" > webapp/version.json

      - name: Build preview artifact
        env:
          EXPECTED_SUPABASE_URL: https://hnawojlnfoaccinlgjyn.supabase.co
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_STAGING_PROJECT_ID }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy one intentional preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_STAGING_PROJECT_ID }}
        run: |
          output="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: E2E handoff marker
        if: inputs.run_e2e == true
        run: echo "Preview is ready for the authenticated E2E runner; no E2E runner is invoked by this workflow."
