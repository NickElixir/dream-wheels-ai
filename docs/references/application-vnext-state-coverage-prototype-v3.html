<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<title>Dream Wheels – VNext state coverage prototype v3</title>
<style>
:root{
  --bg:#07090b;--surface:#0f1317;--surface-2:#13181d;
  --line:rgba(238,242,246,.10);--line-strong:rgba(238,242,246,.16);
  --text:#f1f3f2;--muted:#9aa2a8;--subtle:#707980;
  --cta:#f0efe9;--cta-text:#0c0f11;
  --brand-lime:#d8ff37;
  --positive:#75caa0;--warning:#d8ad67;--negative:#d87979;
  --unknown:#a0a7ac;--pending:#7d878e;
  --good:var(--positive);--warn:var(--warning);--bad:var(--negative);
  --r-sm:7px;--r-md:10px;--r-lg:12px;--sidebar:220px;
  --safe-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html,body{min-height:100%;background:var(--bg)}
body{
  margin:0;color:var(--text);background:var(--bg);
  font:15px/1.45 "IBM Plex Sans","Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d7dbde;outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;padding:26px 18px 22px;
  border-right:1px solid var(--line);background:#080a0c;
  display:flex;flex-direction:column
}
.brand{display:flex;gap:9px;margin:0 8px 34px;font-weight:600;letter-spacing:.16em;font-size:13px}
.brand-dim{color:#8d959b}
.nav{display:grid;gap:5px}
.nav-label{margin:20px 10px 7px;color:#5f6870;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.nav button{
  min-height:42px;border:0;border-radius:var(--r-sm);background:transparent;
  color:#8f979d;text-align:left;padding:0 12px;font-weight:500
}
.nav button:hover{background:#0e1215;color:var(--text)}
.nav button.active{background:#101418;color:var(--text)}
.account{
  margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:end;gap:12px
}
.account small{display:block;color:var(--subtle);font-size:11px}
.account strong{display:block;margin-top:3px;font-size:14px;font-weight:500}
.balance{text-align:right;font-variant-numeric:tabular-nums}
.main{min-width:0;padding:28px clamp(22px,4vw,58px) 90px}
.frame{width:min(1180px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:27px;line-height:1.15;font-weight:500;letter-spacing:-.025em}
.topbar-meta{display:none;color:var(--muted);font-size:12px}
.page{padding-top:24px}
.eyebrow{margin:0 0 8px;color:var(--subtle);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.section-title{margin:0;font-size:24px;font-weight:500;letter-spacing:-.025em}
.section-copy{margin:7px 0 0;color:var(--muted);max-width:720px}
.btn{min-height:46px;border-radius:8px;padding:0 18px;font-weight:500;border:1px solid transparent}
.btn-primary{background:var(--cta);color:var(--cta-text)}
.btn-primary:hover{background:#fff}
.btn-secondary{background:transparent;color:#d5d9dc;border-color:var(--line-strong)}
.btn-secondary:hover{background:#101419}
.btn-text{
  background:transparent;color:#aeb5ba;border:0;padding:0;
  text-decoration:none
}
.btn-text:hover,.btn-text:focus-visible{
  color:var(--text);
  text-decoration:underline;
  text-underline-offset:4px;
  text-decoration-color:#596168
}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.media{overflow:hidden;border-radius:var(--r-lg);border:1px solid rgba(255,255,255,.06);background:#101317}
.media svg,.media img{display:block;width:100%;height:100%;object-fit:contain}
.meta-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-top:11px}
.object-name{font-size:18px;font-weight:500}
.object-sub{margin-top:4px;color:var(--muted);font-size:13px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#aeb6bb}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#778087}
.status.good{color:#abd8be}.status.good::before{background:var(--positive)}
.status.warn{color:#d7bc88}.status.warn::before{background:var(--warning)}
.status.bad{color:#df9a9a}.status.bad::before{background:var(--negative)}
.status.unknown{color:#b1b7bb}.status.unknown::before{background:var(--unknown)}
.status.pending{color:#9da5aa}.status.pending::before{background:var(--pending)}
.island{background:#0c1013;border:1px solid var(--line);border-radius:10px}

/* Dashboard */
.home-intro{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:4px 0 24px
}
.home-intro h2{margin:0;font-size:30px;font-weight:500;letter-spacing:-.035em}
.home-intro p{margin:8px 0 0;color:var(--muted)}
.dashboard-grid{
  display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.75fr);
  gap:18px;align-items:start
}
.latest-island,.balance-island{padding:16px;align-self:start}
.latest-preview{aspect-ratio:16/9}
.latest-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:12px}
.latest-meta strong{display:block;font-size:18px;font-weight:500}
.balance-line{display:flex;justify-content:space-between;align-items:end;gap:16px}
.balance-line strong{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.balance-expiry{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
.expiry-row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;font-size:13px}
.expiry-row span{color:#c9ced1}
.expiry-row strong{color:#d7dcdf;font-weight:500;font-variant-numeric:tabular-nums}
.expiry-note{margin-top:8px;padding-top:10px;border-top:1px solid var(--line);color:#b7a56e;font-size:12px;line-height:1.45}
.recent{margin-top:30px}
.recent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.recent-item{min-width:0}
.recent-item .media{aspect-ratio:16/10}
.recent-item strong{display:block;margin-top:9px;font-weight:500}
.recent-item span{display:block;color:var(--subtle);font-size:12px;margin-top:3px}

/* Create */
.create-pair{
  --pair-preview-h:clamp(320px,31vw,410px);
  display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:16px;
  padding-bottom:24px;border-bottom:1px solid var(--line);align-items:start
}
.source{min-width:0}
.source .media{height:var(--pair-preview-h);aspect-ratio:auto;display:grid;place-items:center}
.source.wheel .media svg,.source.wheel .media img{width:min(100%,var(--pair-preview-h));height:min(100%,var(--pair-preview-h))}
.create-summary{padding-top:22px}
.summary-list{border-top:1px solid var(--line-strong)}
.summary-row{
  display:grid;grid-template-columns:170px minmax(0,1fr) auto;
  gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)
}
.summary-label{color:var(--muted);font-size:12px}
.summary-value{font-weight:500;min-width:0}
.summary-value a{color:#d7dcdf;text-decoration:none}
.summary-value a:hover{text-decoration:underline}
.edit-panel{
  margin:0 0 8px 188px;padding:18px;border:1px solid var(--line);
  border-radius:9px;background:#0b0f12
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px}
.field label{color:var(--muted);font-size:11px}
.field input,.field select{
  min-height:44px;width:100%;border-radius:7px;border:1px solid var(--line-strong);
  background:#101419;color:var(--text);padding:0 12px
}
.edit-actions{display:flex;gap:8px;margin-top:16px}
.edit-note{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.45}
.inline-state{
  display:inline-flex;align-items:center;gap:7px;margin-left:10px;
  color:var(--muted);font-size:11px;font-weight:400
}
.inline-state::before{content:"";width:6px;height:6px;border-radius:50%;background:#697279}
.inline-state.saved{color:#9bcfb1}.inline-state.saved::before{background:var(--positive)}
.inline-state.loading{color:#c8cdd0}
.inline-state.error{color:#df9a9a}.inline-state.error::before{background:var(--negative)}
.parser-state{
  margin-top:12px;padding:12px 13px;border:1px solid var(--line);
  border-radius:7px;background:#0e1215;font-size:12px;line-height:1.45
}
.parser-state strong{display:block;font-weight:500;color:#d8dcdf;margin-bottom:3px}
.parser-state.loading{color:#b7bec3}
.parser-state.success{border-color:rgba(117,202,160,.28);color:#9bcfb1;background:rgba(117,202,160,.045)}
.parser-state.error{border-color:rgba(216,121,121,.32);color:#d9a0a0;background:rgba(216,121,121,.045)}
.parser-recovery{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.parser-recovery .btn{min-height:38px;padding:0 12px;font-size:12px}
.create-actions{margin-top:24px}

/* Fitment */
.fit-context{
  --fit-preview-h:clamp(300px,29vw,390px);
  display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,.75fr);
  gap:16px;padding-bottom:26px;border-bottom:1px solid var(--line);align-items:start
}
.fit-context article{min-width:0}
.fit-context .vehicle-media,.fit-context .wheel-media{height:var(--fit-preview-h);aspect-ratio:auto;display:grid;place-items:center}
.fit-context .wheel-media svg,.fit-context .wheel-media img{width:min(100%,var(--fit-preview-h));height:min(100%,var(--fit-preview-h))}
.fit-content{padding-top:30px}
.fit-verdict{display:flex;align-items:flex-start;gap:14px;max-width:820px}
.fit-mark{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;margin-top:2px;color:var(--negative);font-size:29px;line-height:1;font-weight:500}
.fit-title{margin:0;font-size:clamp(30px,3.5vw,46px);line-height:1.04;font-weight:500;letter-spacing:-.04em}
.fit-copy{margin:13px 0 0;max-width:820px;color:#b5bcc1;font-size:16px}
.fit-table-wrap{margin-top:30px;border-top:1px solid var(--line-strong)}
.fit-table{width:100%;border-collapse:collapse;table-layout:fixed}
.fit-table col:nth-child(1){width:20%}.fit-table col:nth-child(2){width:29%}.fit-table col:nth-child(3){width:22%}.fit-table col:nth-child(4){width:29%}
.fit-table th{padding:13px 10px 11px;text-align:left;color:var(--subtle);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line)}
.fit-table th:first-child,.fit-table td:first-child{padding-left:0}
.fit-table th:last-child,.fit-table td:last-child{padding-right:0}
.fit-table td{padding:15px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.fit-param{color:#aeb5ba;font-size:12px;font-weight:500}
.fit-value{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.fit-result{font-size:22px;line-height:1;font-weight:500}
.fit-result.good{color:var(--positive)}.fit-result.bad{color:var(--negative)}
.fit-row-bad td{background:linear-gradient(90deg,rgba(216,121,121,.055),rgba(216,121,121,0))}
.fit-explainer{margin-top:20px;padding:15px 0;border-bottom:1px solid var(--line);color:#aab2b7;font-size:13px;max-width:760px}
.fit-explainer strong{color:var(--text);font-weight:500}
.fit-disclaimer{display:flex;align-items:flex-start;gap:10px;max-width:900px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);color:#929ba1;font-size:12px}
.fit-info{width:18px;height:18px;flex:0 0 18px;border:1px solid #606970;border-radius:50%;display:grid;place-items:center;color:#c5cacf;font-size:11px}
.fit-disclaimer strong{display:block;color:#d5d9dc;font-weight:500;margin-bottom:3px}
.fit-disclaimer p{margin:0}
.fit-actions{margin-top:24px}

/* Result */
.result-head{margin-bottom:16px}
.result-head h2{margin:0;font-size:24px;font-weight:500;letter-spacing:-.025em}
.result-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.result-primary{margin-top:16px}
.compare{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  border:1px solid rgba(255,255,255,.06);background:#101317;
  aspect-ratio:16/9;--compare:50%
}
.compare-layer{position:absolute;inset:0}
.compare-layer svg,.compare-layer img{display:block;width:100%;height:100%;object-fit:contain}
.compare-after{clip-path:inset(0 calc(100% - var(--compare)) 0 0)}
.compare-divider{position:absolute;top:0;bottom:0;left:var(--compare);width:1px;background:rgba(241,243,242,.78);transform:translateX(-.5px);pointer-events:none}
.compare-handle{
  position:absolute;left:var(--compare);top:50%;transform:translate(-50%,-50%);
  width:38px;height:38px;border-radius:50%;border:1px solid #c7cccf;
  background:rgba(8,10,12,.88);display:grid;place-items:center;color:#e6e8e9;font-size:15px;pointer-events:none
}
.compare-label{
  position:absolute;top:12px;padding:5px 8px;border-radius:5px;
  background:rgba(7,9,11,.72);color:#d1d5d8;font-size:10px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none
}
.compare-label.before{left:12px}.compare-label.after{right:12px}
.compare-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.result-meta-line{margin-top:12px;color:var(--subtle);font-size:12px}
.rating{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.rating-title{font-weight:500;font-size:17px}
.rating-sub{margin-top:4px;color:var(--muted);font-size:12px}
.rating-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.rating-actions button,.feedback-chip{
  min-height:42px;border-radius:7px;border:1px solid var(--line-strong);
  background:transparent;color:#c1c7cb
}
.rating-actions button:hover,.feedback-chip:hover{background:#101419}
.rating-actions button.active-good{border-color:rgba(117,202,160,.55);background:rgba(117,202,160,.08);color:#8ed8b0}
.rating-actions button.active-bad{border-color:rgba(216,173,103,.55);background:rgba(216,173,103,.08);color:#e0ba75}
.feedback-reasons{margin-top:14px}
.feedback-reasons-label{color:var(--muted);font-size:12px;margin-bottom:8px}
.feedback-chips{display:flex;flex-wrap:wrap;gap:7px}
.feedback-chip{min-height:34px;padding:0 11px;font-size:12px}
.feedback-chip.active{border-color:#596168;background:#151a1e;color:#edf0f1}
.feedback-thanks{margin-top:12px;padding:10px 12px;border:1px solid rgba(117,202,160,.38);border-radius:7px;background:rgba(117,202,160,.08);color:#8ed8b0;font-size:12px}


/* State coverage v3 */
.real-media img{display:block;width:100%;height:100%;object-fit:contain;background:#0a0d0f}
.state-intro{max-width:780px;margin-bottom:22px}
.state-intro h2{margin:0;font-size:28px;font-weight:500;letter-spacing:-.03em}
.state-intro p{margin:7px 0 0;color:var(--muted)}
.processing-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);gap:18px;align-items:start}
.processing-card,.history-card,.wallet-panel,.system-card{background:#0c1013;border:1px solid var(--line);border-radius:10px}
.processing-card{padding:18px}
.processing-media{aspect-ratio:16/10;margin-bottom:18px}
.processing-status{display:flex;align-items:flex-start;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.spinner{
  width:22px;height:22px;flex:0 0 22px;border:2px solid #3c454b;border-top-color:#d7dcdf;border-radius:50%;
  animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.processing-status strong{display:block;font-weight:500;font-size:18px}
.processing-status p{margin:5px 0 0;color:var(--muted);font-size:13px}
.processing-aside{padding:16px;border-top:1px solid var(--line)}
.processing-aside .media{aspect-ratio:1/1;margin-top:10px}
.history-list{display:grid;gap:12px}
.history-card{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:18px;align-items:center;padding:12px}
.history-card .media{aspect-ratio:16/10}
.history-title{font-size:18px;font-weight:500}
.history-sub{margin-top:4px;color:var(--muted);font-size:13px}
.history-state{margin-top:10px}
.history-actions{display:flex;align-items:center;justify-content:flex-end}
.state-pill{
  display:inline-flex;align-items:center;min-height:28px;padding:0 9px;border:1px solid var(--line);
  border-radius:999px;color:#aeb6bb;font-size:11px
}
.state-pill.good{color:#abd8be;border-color:rgba(117,202,160,.25)}
.state-pill.bad{color:#df9a9a;border-color:rgba(216,121,121,.25)}
.wallet-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:18px;align-items:start}
.wallet-panel{padding:18px}
.wallet-balance-hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}
.wallet-balance-hero strong{display:block;font-size:42px;font-weight:500;line-height:1}
.package-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
.package-card{
  min-height:112px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#0f1317;color:var(--text);
  text-align:left
}
.package-card:hover,.package-card.selected{border-color:#5a6268;background:#13181d}
.package-card strong{display:block;font-size:20px;font-weight:500}
.package-card span{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.wallet-form{display:grid;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.payment-state{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.payment-state strong{font-weight:500}
.payment-state p{margin:5px 0 0;color:var(--muted);font-size:12px}

.wallet-history{grid-column:1/-1;padding:18px}
.wallet-history-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}
.wallet-history-head h3{margin:0;font-size:20px;font-weight:500}
.payment-history-list{display:grid;border-top:1px solid var(--line)}
.payment-history-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;
  min-height:72px;padding:12px 0;border-bottom:1px solid var(--line)
}
.payment-history-main{display:grid;grid-template-columns:100px 120px minmax(0,1fr);gap:18px;align-items:baseline}
.payment-history-amount{font-size:16px;font-weight:500}
.payment-history-renders{color:var(--muted);font-size:12px}
.payment-history-meta{display:flex;gap:16px;color:var(--subtle);font-size:11px}
.wallet-history-more{margin-top:14px}

.auth-preview .app{display:block}
.auth-preview .sidebar,.auth-preview .topbar,.auth-preview .mobile-nav{display:none!important}
.auth-preview .main{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-preview .frame{width:min(520px,100%);margin:0}
.auth-preview .page{padding:0}
.auth-card{
  padding:28px;border:1px solid var(--line);border-radius:12px;background:#0c1013;
  box-shadow:0 26px 70px rgba(0,0,0,.28)
}
.auth-wordmark{margin-bottom:28px;font-weight:600;letter-spacing:.16em;font-size:13px}
.auth-card h2{margin:0;font-size:29px;font-weight:500;letter-spacing:-.035em}
.auth-card p{margin:8px 0 0;color:var(--muted)}
.auth-form{display:grid;gap:12px;margin-top:22px}
.auth-form input{min-height:48px;border-radius:7px;border:1px solid var(--line-strong);background:#101419;color:var(--text);padding:0 12px}
.auth-legal{margin-top:16px;color:var(--subtle);font-size:11px}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.system-wrap{display:grid;place-items:center;min-height:56vh}
.system-card{width:min(620px,100%);padding:28px}
.system-mark{font-size:26px;color:var(--warning);margin-bottom:12px}
.system-card h2{margin:0;font-size:28px;font-weight:500;letter-spacing:-.03em}
.system-card p{margin:8px 0 0;color:var(--muted);max-width:520px}
.system-card .actions{margin-top:22px}
.review-subhead{grid-column:1/-1;margin:8px 2px 0;color:#697279;font-size:9px;text-transform:uppercase;letter-spacing:.13em;font-weight:600}

/* Review harness */
.review{
  position:fixed;right:16px;bottom:16px;z-index:20;
  width:min(330px,calc(100vw - 32px));
  background:rgba(12,15,18,.97);border:1px solid #293036;border-radius:10px;
  box-shadow:0 16px 42px rgba(0,0,0,.38);overflow:hidden
}
.review:not([open]){width:auto}

let current=localStorage.getItem("dw-vnext-v2-screen")||"dashboard";

function render(){
  document.body.classList.toggle("auth-preview",current==="auth");
  const s=screens[current];
  document.getElementById("pageTitle").textContent=s.title;
  document.getElementById("screen").innerHTML=s.html();

  document.querySelectorAll("[data-nav]").forEach(function(b){
    b.classList.toggle("active",b.dataset.nav===current);
    b.onclick=function(){setScreen(b.dataset.nav)};
  });
  document.querySelectorAll("[data-mobile]").forEach(function(b){
    const mobileCurrent=current==="fitment"?"create":(current==="result"||current==="processing"?"history":current);
    b.classList.toggle("active",b.dataset.mobile===mobileCurrent);
    b.onclick=function(){setScreen(b.dataset.mobile)};
  });
  document.querySelectorAll("[data-screen]").forEach(function(b){
    b.classList.toggle("active",b.dataset.screen===current);
    b.onclick=function(){setScreen(b.dataset.screen)};
  });
  document.querySelectorAll("[data-payment-state]").forEach(function(b){
    const active=window.__dwPaymentState||"pending";
    b.classList.toggle("active",b.dataset.paymentState===active);
    b.onclick=function(){window.__dwPaymentState=b.dataset.paymentState;setScreen("wallet")};
  });
  document.querySelectorAll("[data-auth-state]").forEach(function(b){
    const active=window.__dwAuthState||"login";
    b.classList.toggle("active",b.dataset.authState===active);
    b.onclick=function(){window.__dwAuthState=b.dataset.authState;setScreen("auth")};
  });
  document.querySelectorAll("[data-system-state]").forEach(function(b){
    const active=window.__dwSystemState||"history_empty";
    b.classList.toggle("active",b.dataset.systemState===active);
    b.onclick=function(){window.__dwSystemState=b.dataset.systemState;setScreen("system")};
  });
  document.querySelectorAll("[data-go]").forEach(function(b){
    b.onclick=function(){setScreen(b.dataset.go)};
  });
  document.querySelectorAll("[data-auth-state-inline]").forEach(function(b){
    b.onclick=function(){window.__dwAuthState=b.dataset.authStateInline;render()};
  });

  document.querySelectorAll("[data-edit]").forEach(function(b){
    b.onclick=function(){
      const key=b.dataset.edit;
      document.querySelectorAll("[data-panel]").forEach(function(p){p.hidden=p.dataset.panel!==key});
    };
  });
  document.querySelectorAll("[data-close]").forEach(function(b){
    b.onclick=function(){
      const panel=document.querySelector('[data-panel="'+b.dataset.close+'"]');
      if(panel) panel.hidden=true;
    };
  });

  function setInlineState(key,textValue,tone){
    const state=document.querySelector('[data-state="'+key+'"]');
    if(!state) return;
    state.hidden=false;
    state.textContent=textValue;
    state.className="inline-state "+(tone||"");
  }

  document.querySelectorAll("[data-save]").forEach(function(b){
    b.onclick=function(){
      const key=b.dataset.save;
      setInlineState(key,"Сохранено","saved");
      const panel=document.querySelector('[data-panel="'+key+'"]');
      if(panel) panel.hidden=true;
    };
  });

  let parserReviewMode=window.__dwParserReviewMode||"success";
  document.querySelectorAll("[data-review-parser]").forEach(function(b){
    b.classList.toggle("active",b.dataset.reviewParser===parserReviewMode);
    b.onclick=function(){
      window.__dwParserReviewMode=b.dataset.reviewParser;
      parserReviewMode=b.dataset.reviewParser;
      document.querySelectorAll("[data-review-parser]").forEach(function(x){
        x.classList.toggle("active",x.dataset.reviewParser===parserReviewMode);
      });
      if(current!=="create") setScreen("create");
    };
  });

  function showParserState(name){
    document.querySelectorAll("[data-parser-state]").forEach(function(el){
      el.hidden=el.dataset.parserState!==name;
    });
  }

  document.querySelectorAll("[data-parser-save]").forEach(function(b){
    b.onclick=function(){
      const key=b.dataset.parserSave;
      b.disabled=true;
      showParserState("loading");
      setInlineState(key,"Получаем данные","loading");
      window.setTimeout(function(){
        if(parserReviewMode==="error"){
          showParserState("error");
          setInlineState(key,"Ошибка получения данных","error");
          b.disabled=false;
          return;
        }
        showParserState("success");
        setInlineState(key,"Данные обновлены","saved");
        b.disabled=false;
      },650);
    };
  });

  document.querySelectorAll("[data-parser-retry]").forEach(function(b){
    b.onclick=function(){
      showParserState("");
      const input=document.querySelector("[data-source-url]");
      if(input){input.focus();input.select()}
    };
  });
  document.querySelectorAll("[data-manual-wheel]").forEach(function(b){
    b.onclick=function(){
      showParserState("");
      setInlineState("source","Фото загружается вручную","loading");
      window.setTimeout(function(){setInlineState("source","Фото загружено","saved")},500);
    };
  });

  const range=document.getElementById("compareRange");
  const compare=document.getElementById("resultCompare");
  if(range&&compare){
    range.oninput=function(){compare.style.setProperty("--compare",range.value+"%")};
  }

  const ratingButtons=document.querySelectorAll("[data-rating]");
  const reasons=document.getElementById("feedbackReasons");
  const thanks=document.getElementById("feedbackThanks");
  ratingButtons.forEach(function(b){
    b.onclick=function(){
      ratingButtons.forEach(function(x){x.classList.remove("active-good","active-bad")});
      if(b.dataset.rating==="good"){
        b.classList.add("active-good");
        if(reasons) reasons.hidden=true;
        if(thanks) thanks.hidden=false;
      }else{
        b.classList.add("active-bad");
        if(reasons) reasons.hidden=false;
        if(thanks) thanks.hidden=true;
      }
    };
  });
  document.querySelectorAll(".feedback-chip").forEach(function(b){
    b.onclick=function(){
      b.classList.toggle("active");
      if(thanks) thanks.hidden=false;
    };
  });
}

function setScreen(key){
  current=key;
  localStorage.setItem("dw-vnext-v2-screen",key);
  render();
}
render();
</script>
</body>
</html>
