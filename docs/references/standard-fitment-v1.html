-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}.summary-row:last-child{border-bottom:0}.summary-row span{color:var(--muted)}.summary-row b{text-align:right}.notice{margin-top:14px;border:1px solid var(--line);border-left-width:3px;border-radius:13px;padding:12px 13px;color:var(--muted)}.notice strong{display:block;color:var(--text);margin-bottom:3px}.notice.warn{border-left-color:var(--warn)}.notice.bad{border-left-color:var(--bad)}.notice.info{border-left-color:var(--info)}.notice.good{border-left-color:var(--good)}.candidate-list{display:grid;gap:9px}.candidate{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:13px;background:#131820;color:var(--text)}.candidate:hover{border-color:rgba(221,255,0,.42)}.candidate.suggested{border-color:rgba(255,204,86,.35);background:rgba(255,204,86,.045)}.candidate.confirmed{border-color:rgba(39,216,138,.38);background:rgba(39,216,138,.05)}.candidate b{display:block}.candidate span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.candidate em{font-style:normal;color:var(--subtle);font-size:12px;align-self:center}.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.axis{border:1px solid var(--line);border-radius:14px;padding:14px;background:#12171d}.axis h3{font-size:14px;margin:0 0 12px}.parser-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.parser-actions .btn{min-height:88px;text-align:left}.spin{width:17px;height:17px;border:2px solid rgba(221,255,0,.2);border-top-color:var(--acid);border-radius:50%;display:inline-block;vertical-align:-4px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status-stack{display:grid;gap:10px}.verdict{border:1px solid var(--line);border-radius:14px;padding:15px;background:#12171d}.verdict h3{margin:0;font-size:18px}.verdict p{margin:5px 0 0;color:var(--muted)}.verdict.good{border-color:rgba(39,216,138 <body>
<div class="app">

</div>

<div class="demo-group"><strong>Автомобиль</strong><div>
<button data-scenario="vehicle-empty">Пусто</button><button data-scenario="vehicle-unconfirmed">VLM proposal</button><button data-scenario="vehicle-incomplete">Confirmed incomplete</button><button data-scenario="vehicle-invalid">Validation</button><button data-scenario="vehicle-saving">Saving</button><button data-scenario="vehicle-save-failed">Save failed</button><button data-scenario="vehicle-one">Одна комплектация</button><button data-scenario="vehicle-multiple">Несколько</button><button data-scenario="vehicle-no-match">No match</button><button data-scenario="vehicle-failed">Provider failure</button></div></div>

<button data-scenario="rim-empty">Пусто</button><button data-scenario="rim-resolving">Resolver</button><button data-scenario="rim-resolved">Suggestions</button><button data-scenario="rim-failed">Resolver failed</button><button data-scenario="rim-manual">Manual edit</button><button data-scenario="rim-variants">Несколько SKU</button><button data-scenario="rim-partial">Partial</button><button data-scenario="rim-unconfirmed">Confirm fields</button><button data-scenario="rim-confirmed">Confirmed</button><button data-scenario="rim-conflict">Parser conflict</button><button data-scenario="rim-staggered">Staggered</button></div></div>

<button data-scenario="check-idle">Idle</button><button data-scenario="check-submitting">Submitting</button><button data-scenario="check-queued">Queued</button><button data-scenario="check-processing">Processing</button><button data-scenario="check-failed">Operational error</button><button data-scenario="quota-known">Quota retry_at</button><button data-scenario="quota-unknown">Quota unknown</button><button data-scenario="session">Session expired</button></div></div>

<button data-scenario="verdict-compatible">Compatible</button><button data-scenario="verdict-conditional">Condition</button><button data-scenario="verdict-unknown">Unknown</button><button data-scenario="verdict-incompatible">Incompatible</button><button data-scenario="stale-vehicle">Vehicle changed</button><button data-scenario="stale-rim">Rim changed</button><button data-scenario="stale-new-sku">New URL or SKU</button><button data-scenario="render-return">Render return</button></div></div>

<script>
const base=()=>({vehicle:'confirmed_ready',form:'clean',validation:'valid',lookup:'loaded',mod:'confirmed',source:'wheel_size_single',rim:'confirmed_ready',resolver:'resolved',variant:'not_applicable',check:'idle',verdict:null,notice:null,render:'idle',stale:null,staggered:false,session:false,make:'Porsche',model:'Cayenne',region:'russia',year:'2021',controls:{diameter:'20',diameterCustom:'',width:'9',widthCustom:'',pcdBolt:'5',pcdBoltCustom:'',pcdMm:'130',pcdMmCustom:'',dia:'71.6',et:'40'}});
let state=base(),timer;
if(window.matchMedia('(max-width: 820px)').matches)document.querySelector('.demo-drawer').removeAttribute('open');
const vehicle=document.querySelector('#vehicle-section'),rim=document.querySelector('#rim-section'),check=document.querySelector('#check-section'),toast=document.querySelector('#toast');
function flash(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2600)}
function btn(label,kind='secondary',disabled=false,action=''){return '<button class="btn '+kind+'" '+(disabled?'disabled':'')+' data-action="'+action+'">'+label+'</button>'}
function badge(text,tone='acid'){return '<span class="badge '+tone+'">'+text+'</span>'}
const regions=[['russia','Россия+'],['eudm','Европа'],['usdm','США+'],['jdm','Япония'],['chdm','Китай'],['cdm','Канада'],['mxndm','Мексика'],['ladm','Центральная и Южная Америка'],['skdm','Южная Корея'],['sam','Юго-Восточная Азия'],['medm','Ближний Восток'],['nadm','Северная Африка'],['sadm','Южная Африка'],['audm','Океания']];
const demoYearsFor=(region)=>region==='russia'?['2018','2019','2020','2021','2022','2023']:[];
const vehicleContextReady=()=>state.make==='Porsche'&&state.model==='Cayenne';
const hasAvailableVehicleYear=()=>vehicleContextReady()&&demoYearsFor(state.region).includes(state.year);
const hasRequiredVehicle=()=>state.vehicle!=='empty'&&vehicleContextReady()&&Boolean(state.region)&&hasAvailableVehicleYear();
const ruNumber=(value)=>String(value??'').replace('.',',');
const exactNumber=(value)=>String(value??'').trim().replace(',','.');
const esc=(value)=>String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
function optionList(items,current,placeholder){return (placeholder?'<option value="" '+(!current?'selected':'')+'>'+placeholder+'</option>':'')+items.map(([value,label])=>'<option value="'+value+'" '+(String(value)===String(current)?'selected':'')+'>'+label+'</option>').join('')}
function presetSelect(label,control,values,current,format,help='',customValue=''){const custom=String(current)==='custom';return '<div class="field"><label>'+label+'</label><select class="select-control" data-control="'+control+'" aria-label="'+label+'">'+optionList(values.map(value=>[value,format(value)]).concat([['custom','Другое значение']]),current)+'</select>'+(custom?'<input class="custom-exact" data-control="'+control+'-custom" value="'+esc(ruNumber(customValue))+'" inputmode="decimal" aria-label="'+label+' другое значение" placeholder="Точное значение">':'')+(help?'<small>'+help+'</small>':'')+'</div>'}
function selectedControl(key){const c=state.controls;const customKey=key+'Custom';return c[key]==='custom'?c[customKey]:c[key]}
function rimTechnicalSeries(){const c=state.controls;return (ruNumber(selectedControl('diameter'))||'—')+'" / '+(ruNumber(selectedControl('width'))||'—')+'J / '+(selectedControl('pcdBolt')||'—')+'×'+(ruNumber(selectedControl('pcdMm'))||'—')}
function rimSecondarySeries(){const c=state.controls;return 'ET '+(ruNumber(c.et)||'—')+' / DIA '+(ruNumber(c.dia)||'—')}
function rimMissing(){const c=state.controls;return ['ET','DIA'].filter(name=>!c[name.toLowerCase()]).join(', ')}
function vehicleMarkup(){
 let body='';
 if(state.session){body='<div class="notice bad"><strong>Сессия истекла</strong><div>Войдите через Telegram, чтобы продолжить</div><div class="actions">'+btn('Войти через Telegram','primary',false,'login')+'</div></div>'}
 else if(state.vehicle==='empty'){body='<div class="notice info"><strong>Параметры автомобиля пока не указаны</strong><div>Заполните данные, чтобы найти комплектации</div></div>'+vehicleForm()}
 else if(state.vehicle==='unconfirmed'){body='<div class="identity"><div><h3>Porsche Cayenne</h3><p>'+state.year+', '+(regions.find(item=>item[0]===state.region)||regions[0])[1]+'</p></div>'+badge('Требует подтверждения','warn')+'</div><div class="notice info"><strong>Данные определены по фото</strong><div>Проверьте марку, модель, год и рынок перед сохранением</div></div>'+vehicleForm(true)}
 else if(state.vehicle==='confirmed_incomplete'){body='<div class="notice warn"><strong>Не хватает данных автомобиля</strong><div>Укажите обязательные данные перед поиском комплектации</div></div>'+vehicleForm()}
 else {body='<div class="identity"><div><h3>Porsche Cayenne</h3><p>'+state.year+', '+(regions.find(item=>item[0]===state.region)||regions[0])[1]+'</p></div>'+badge('Подтверждено пользователем','good')+'</div>'+vehicleForm()}
 if(!state.session) body+=modificationMarkup();
 return '<div class="section-head"><h2>Автомобиль</h2><span class="step">Шаг 1 из 3</span></div>'+body;
}
function vehicleForm(proposal=false){
 const saving=state.form==='saving',failed=state.form==='save_failed';
 const empty=state.vehicle==='empty',contextReady=vehicleContextReady(),years=demoYearsFor(state.region),yearEnabled=contextReady&&years.length>0;
 const makeInvalid=state.validation==='invalid'&&!state.make;
 const modelInvalid=state.validation==='invalid'&&!state.model;
 const regionInvalid=state.validation==='invalid'&&!state.region;
 const yearInvalid=state.validation==='invalid'&&!hasAvailableVehicleYear();
 const unavailable='<option value="">Для этого demo-сценария годы не загружены</option>';
 const make='<select class="'+(makeInvalid?'invalid':'')+'" data-control="vehicle-make" aria-label="Марка">'+optionList([['Porsche','Porsche']],state.make,'Выберите марку')+'</select>'+(makeInvalid?'<small class="field-error">Укажите марку автомобиля</small>':'');
 const model='<select class="'+(modelInvalid?'invalid':'')+'" data-control="vehicle-model" aria-label="Модель" '+(!state.make?'disabled':'')+'>'+optionList([['Cayenne','Cayenne']],state.model,'Выберите модель')+'</select>'+(modelInvalid?'<small class="field-error">Укажите модель автомобиля</small>':'');

document.addEventListener('input',e=>{const control=e.target.dataset.control;if(!control)return;const c=state.controls;const map={'rim-diameter-custom':'diameterCustom','rim-width-custom':'widthCustom','pcd-bolt-custom':'pcdBoltCustom','pcd-mm-custom':'pcdMmCustom','rim-dia':'dia','rim-et':'et'};if(map[control])c[map[control]]=exactNumber(e.target.value)});
document.addEventListener('click',e=>{const s=e.target.closest('[data-scenario]');if(s){setScenario(s.dataset.scenario);return}const a=e.target.closest('[data-action]');if(!a)return;const x=a.dataset.action;
 if(x==='save-vehicle'){if(!hasRequiredVehicle()){state.form='dirty';state.validation='invalid';state.vehicle='confirmed_incomplete';state.mod='none';state.lookup='idle';render();flash('Укажите год и рынок');return}state.form='saving';state.validation='valid';state.lookup='loading';state.mod='none';render();setTimeout(()=>{state.form='clean';state.validation='valid';state.vehicle='confirmed_ready';state.lookup='loaded';state.mod='confirmed';state.source='wheel_size_single';render();flash('Данные автомобиля сохранены')},700)}
 if(x==='retry-lookup'){if(!hasRequiredVehicle()){state.form='dirty';state.validation='invalid';state.vehicle='confirmed_incomplete';state.mod='none';state.lookup='idle';render();flash('Укажите год и рынок');return}state.lookup='loading';render();setTimeout(()=>{state.lookup='loaded';state.mod='suggested';render()},550)}
 if(x==='change-mod'){state.mod='suggested';state.source=null;render()}
 if(x==='select-mod'){state.mod='confirmed';state.source='user';render();flash('Комплектация подтверждена')}
 if(x==='resolve-rim'){state.resolver='resolving';state.rim='empty';render();setTimeout(()=>{state.resolver='resolved';state.rim='complete_unconfirmed';render()},700)}
 if(x==='manual-rim'){state.resolver='resolved';state.rim='manual';render()}
 if(x==='save-manual'){state.rim=state.controls.et&&state.controls.dia?'complete_unconfirmed':'partial';render();flash('Параметры сохранены')}
 if(x==='choose-sku'){state.variant='selected';state.rim='complete_unconfirmed';render();flash('Вариант диска выбран')}
 if(x==='confirm-rim'){state.rim='confirmed_ready';render();flash('Параметры подтверждены')}
 if(x==='keep-et'){state.rim='confirmed_ready';render();flash('Подтверждённое значение сохранено')}
 if(x==='use-et'){state.rim='complete_unconfirmed';render();flash('Новое значение требует подтверждения')}
 if(x==='run-check'){if(state.rim==='empty'||state.rim==='manual'||state.mod!=='confirmed'){flash('Сначала сохраните и подтвердите доступные данные');return}state.check='submitting';state.verdict=null;render();setTimeout(()=>{state.check='queued';render()},450);setTimeout(()=>{state.check='processing';render()},900);setTimeout(()=>{state.check='completed';state.verdict='compatible';render()},1400)}
 if(x==='create-image'){state.render='creating';render();setTimeout(()=>{state.render='result';render()},900)}
 if(x==='return-fitment'){state.render='idle';render()}
 if(x==='login'){state.session=false;render();flash('Данные восстановлены')}
});
render();
</script>
</body>
</html>
