<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VNext Visual System 2.0 Phase 1 QA</title>
  <link rel="stylesheet" href="/webapp/vnext/styles/tokens.css">
  <link rel="stylesheet" href="/webapp/vnext/styles/foundation.css">
  <link rel="stylesheet" href="/webapp/vnext/styles/shell.css">
  <link rel="stylesheet" href="/webapp/vnext/styles/surfaces.css">
  <link rel="stylesheet" href="/webapp/vnext/styles/auth.css">
  <link rel="stylesheet" href="/webapp/vnext/styles/render.css">
  <link rel="stylesheet" href="/webapp/vnext/styles/fitment.css">
  <link rel="stylesheet" href="/webapp/vnext/styles/wallet.css">
  <style>html,body{margin:0;background:var(--vnext-canvas)}</style>
</head>
<body>
<div id="fixture" data-vnext-root></div>
<script type="module">
  import { createAppShell } from "/webapp/vnext/shell/app-shell.js";
  import { createDashboardView } from "/webapp/vnext/views/dashboard.js";
  import { createCreateView } from "/webapp/vnext/views/create.js";
  import { createRenderView } from "/webapp/vnext/views/render.js";
  import { createFitmentView } from "/webapp/vnext/views/fitment.js";
  import { createWalletView, refreshWalletView } from "/webapp/vnext/views/wallet.js";

  const params = new URLSearchParams(location.search);
  const view = params.get("view") || "dashboard";
  const vehicle = "/webapp/assets/demo-vehicle-zeekr.jpg";
  const wheel = "/webapp/assets/demo-rim-xtrike.png";
  const result = "/webapp/assets/demo-render-zeekr-xtrike.jpg";
  const dashboardJob = { jobId: "qa", title: "Zeekr 001", subtitle: "Сегодня, 12:30", status: "completed", canOpen: true, imageUrl: result };
  const models = {
    dashboard: () => createDashboardView({ authenticated: true, balance: 28, balanceLabel: "28 рендеров", expiry: [], latest: dashboardJob, recent: [dashboardJob] }),
    create: () => createCreateView({ files: { car: { previewUrl: vehicle }, wheel: { previewUrl: wheel } }, bothReady: true, consentAccepted: true, draftId: "qa", selectedVehicle: { make: "Zeekr", model: "001", year: 2025 }, selectedVehicleIndex: 0, vehicleEditing: true, proposal: { vehicle: { primary: { make: "Zeekr", model: "001", year: 2025 }, alternatives: [{ make: "Zeekr", model: "001 Performance", year: 2025 }] }, rim: { brand: "Xtrike", model: "R18", wheel_diameter_in: 18, wheel_width_j: 8, pcd: "5x112" } } }),
    result: () => createRenderView("result", { jobId: "qa", status: "completed", originalUrl: vehicle, resultUrl: result, title: "Zeekr 001", rimName: "Xtrike R18", specs: "18 × 8J · 5×112", createdLabel: "Сегодня, 12:30", canFitment: true, canDownload: true, feedback: { sentiment: "liked" } }),
    renders: () => createRenderView("history", { rows: [{ jobId: "qa", dateLabel: "Сегодня", thumbnailUrl: result, title: "Zeekr 001", rimName: "Xtrike R18", createdLabel: "12:30", status: "completed", statusLabel: "Готово" }] }),
    wallet: () => createWalletView({ authenticated: true, cabinetLoaded: true, balance: 28, balanceUnit: "рендеров", expiryCohorts: [], topUpPackages: [{ amount: 100, amountLabel: "100 ₽", creditsLabel: "3 рендера" }, { amount: 200, amountLabel: "200 ₽", creditsLabel: "7 рендеров" }, { amount: 500, amountLabel: "500 ₽", creditsLabel: "20 рендеров" }, { amount: 1000, amountLabel: "1 000 ₽", creditsLabel: "45 рендеров" }], selectedPackage: { amount: 100, amountLabel: "100 ₽", creditsLabel: "3 рендера" }, receiptEmail: "qa@example.com", validEmail: true, paymentHistory: [{ amountLabel: "100 ₽", creditsLabel: "3 рендера", dateLabel: "Сегодня", invoiceId: "000053", statusLabel: "Оплачено", tone: "success" }] }),
    fitment: () => createFitmentView({ overview: {}, vehicleTitle: "Zeekr 001", vehiclePreview: vehicle, rimTitle: "Xtrike R18", rimPreview: wheel, nextAction: "select_vehicle_variant", vehicleVariants: [{ label: "Zeekr 001 Long Range", technical: "2025" }, { label: "Zeekr 001 Performance", technical: "2025" }], selectedVehicleVariant: 0, vehicleVariantPickerOpen: true, canRunCheck: false }),
  };
  const titles = { dashboard: "Главная", create: "Примерить диски", result: "Результат", renders: "Мои примерки", wallet: "Баланс", fitment: "Совместимость" };
  const host = document.querySelector("#fixture");
  if (view === "auth") {
    host.innerHTML = '<div class="application-auth-gate" style="min-height:100vh;display:grid;place-items:center"><section class="application-auth-gate-card"><div class="application-auth-gate-wordmark">DREAM WHEELS AI</div><h1 class="application-auth-gate-title">Войдите в Dream Wheels AI</h1><p class="application-auth-gate-copy">Сохраните примерки и откройте баланс.</p><button class="primary-button" type="button">Войти</button></section></div>';
  } else {
    const content = (models[view] || models.dashboard)();
    host.append(createAppShell({ title: titles[view] || titles.dashboard, activeView: view === "result" || view === "fitment" ? "renders" : view, content, authenticated: true, navigate() {} }));
  }
  window.visualQa = { view, overflow: () => document.documentElement.scrollWidth > window.innerWidth, widths: () => ({ scroll: document.documentElement.scrollWidth, inner: window.innerWidth }) };
</script>
</body>
</html>
