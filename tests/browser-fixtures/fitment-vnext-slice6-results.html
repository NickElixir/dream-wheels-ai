<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitment VNext Results QA</title>
<link rel="stylesheet" href="../../webapp/vnext/styles/tokens.css">
<link rel="stylesheet" href="../../webapp/vnext/styles/foundation.css">
<link rel="stylesheet" href="../../webapp/vnext/styles/fitment.css">
<style>body{margin:0;background:#090d10;color:#f2f4f5;font-family:Arial,sans-serif}main{max-width:1120px;margin:auto;padding:24px 16px}nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:24px}</style></head>
<body><main data-vnext-root><nav aria-label="QA scenarios"><button id="queued">Queued</button><button id="failed">Failed</button></nav><div id="fitment"></div></main>
<script type="module">
import { createFitmentView, refreshFitmentView } from "../../webapp/vnext/views/fitment.js";
const rows = [
{field:"wheel_diameter_in",name:"Диаметр",vehicleValue:"18 / 20 / 22",rimValue:"18",resultLabel:"Подходит"},
{field:"wheel_width_j",name:"Ширина",vehicleValue:"7.5 / 8 / 9",rimValue:"8",resultLabel:"Подходит"},
{field:"pcd",name:"PCD",vehicleValue:"5×112",rimValue:"5×112",resultLabel:"Совпадает"},
{field:"center_bore_mm",name:"DIA",vehicleValue:"66.6",rimValue:"72.6",resultLabel:"Нужны кольца"},
{field:"offset_et_mm",name:"ET",vehicleValue:"30–45",rimValue:"35.125",resultLabel:"Подходит"}];
const model={overview:{vehicle_state:"confirmed_ready",rim_setup_state:"confirmed_ready"},vehicleTitle:"Mercedes-Benz GLC",rimTitle:"BBS CI-R",vehicleStatus:"Автомобиль подтверждён",nextAction:"run_standard_check",canRunCheck:true,executionStatus:"completed",check:{execution_status:"completed",verdict:"compatible_with_conditions",is_current:true},fieldEvidence:rows,conditions:[{label:"Для DIA 72,6 → 66,6 потребуются центровочные кольца."}]};
const root=createFitmentView(model,{});document.getElementById("fitment").append(root);
const nav=document.querySelector("nav");nav.replaceChildren();
for(const verdict of ["compatible","compatible_with_conditions","incompatible","unknown","stale"]){const button=document.createElement("button");button.textContent=verdict;button.onclick=()=>{model.check.verdict=verdict==="stale"?"compatible_with_conditions":verdict;model.check.is_current=verdict!=="stale";model.conditions=verdict==="compatible_with_conditions"?[{label:"Для DIA 72,6 → 66,6 потребуются центровочные кольца."}]:[];model.blockingIssues=verdict==="incompatible"?[{label:"PCD колесного диска не совпадает с PCD автомобиля."}]:[];model.retryAvailable=true;refreshFitmentView(root,model);};nav.append(button);}
</script></body></html>
