<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitment VNext Check QA</title>
<link rel="stylesheet" href="../../webapp/vnext/styles/tokens.css">
<link rel="stylesheet" href="../../webapp/vnext/styles/foundation.css">
<link rel="stylesheet" href="../../webapp/vnext/styles/fitment.css">
<style>body{margin:0;background:#090d10;color:#f2f4f5;font-family:Arial,sans-serif}main{max-width:1120px;margin:auto;padding:24px 16px}nav{display:flex;gap:14px;margin-bottom:24px}</style></head>
<body><main data-vnext-root><nav aria-label="QA scenarios"><button id="queued">Queued</button><button id="failed">Failed</button></nav><div id="fitment"></div></main>
<script type="module">
import { createFitmentView, refreshFitmentView } from "../../webapp/vnext/views/fitment.js";
const model = {overview:{vehicle_state:"confirmed_ready",rim_setup_state:"confirmed_ready"},vehicleTitle:"Mercedes-Benz GLC",rimTitle:"BBS CI-R",vehicleStatus:"Автомобиль подтверждён",nextAction:"run_standard_check",canRunCheck:true};
const root=createFitmentView(model,{action(action){if(action==="check"){model.executionStatus="processing";model.checking=true;model.canRunCheck=false;}refreshFitmentView(root,model);}});
document.getElementById("fitment").append(root);
document.getElementById("queued").onclick=()=>{model.executionStatus="queued";model.checking=true;model.canRunCheck=false;refreshFitmentView(root,model);};
document.getElementById("failed").onclick=()=>{model.executionStatus="failed";model.checking=false;model.canRunCheck=true;model.retryAvailable=true;refreshFitmentView(root,model);};
</script></body></html>
