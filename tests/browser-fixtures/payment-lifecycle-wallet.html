<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W-02 payment lifecycle wallet</title>
<link rel="stylesheet" href="../../webapp/vnext/styles/tokens.css"><link rel="stylesheet" href="../../webapp/vnext/styles/foundation.css"><link rel="stylesheet" href="../../webapp/vnext/styles/wallet.css">
<style>[hidden]{display:none!important}body{margin:0;background:var(--vnext-canvas)}main{max-width:1120px;margin:24px auto;padding:16px;color:var(--vnext-text)}</style></head><body><main data-vnext-root><h1>Баланс — W-02</h1><div id="fixture"></div></main><script type="module">
// Production projection/view, deterministic local state; no checkout/provider calls.
const url=new URL('../../webapp/app.js',location.href);
const source=(await (await fetch(url)).text()).replace(/from "(\.\/[^\"]+)"/g,(_,path)=>`from "${new URL(path,url)}"`);
const harness=`
import {createWalletView} from "${new URL('../../webapp/vnext/views/wallet.js',location.href)}";
getWebsiteAuthToken=()=>"local-fixture-token";
state.balance=42;
state.walletCabinetLoaded=true;
state.payments=["cancelled","paid","pending","failed","refunded"].map((status,index)=>({invoiceId:45-index,amount:200,credits:7,createdAt:"Сегодня",createdAtMs:Date.now(),status}));
document.querySelector('#fixture').append(createWalletView(vnextWalletSnapshot(),{}));
`;
const module=URL.createObjectURL(new Blob([source,harness],{type:'text/javascript'}));await import(module);URL.revokeObjectURL(module);
</script></body></html>
