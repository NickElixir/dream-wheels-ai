<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI-007 — account try-on numbering</title>
<link rel="stylesheet" href="../../webapp/vnext/styles/tokens.css"><link rel="stylesheet" href="../../webapp/vnext/styles/foundation.css"><link rel="stylesheet" href="../../webapp/vnext/styles/surfaces.css"><link rel="stylesheet" href="../../webapp/vnext/styles/approved-home-create.css"><link rel="stylesheet" href="../../webapp/vnext/styles/render.css">
<style>body{background:var(--vnext-canvas);color:var(--vnext-text);font-family:var(--vnext-font);margin:0}main{max-width:1100px;margin:auto;padding:24px 16px}nav{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}select{padding:10px}#checks{white-space:pre-wrap}img{max-width:100%}</style></head>
<body><main><nav><select id="language" aria-label="Language"><option>ru</option><option>en</option></select><select id="screen" aria-label="Screen"><option>home</option><option>history</option><option>result</option></select><select id="variant" aria-label="Title"><option value="number">Number</option><option value="vehicle">Confirmed vehicle</option><option value="missing">Missing number</option></select></nav><p id="checks" role="status"></p><div id="view"></div></main>
<script type="module">
import {createDashboardView} from '../../webapp/vnext/views/dashboard.js';
import {createRenderView,refreshRenderView} from '../../webapp/vnext/views/render.js';
const source=await (await fetch('../../webapp/app.js')).text();
const fn=name=>{const start=source.indexOf(`function ${name}(`);return source.slice(start,source.indexOf('\n}',start)+2);};
const title=(job,locale,kind)=>new Function('job','locale',`${fn('accountTryOnTitle')}\n${fn('homeRenderTitle')}\n${fn('historyGalleryTitle')}\nreturn ${kind}(job);`)(job,locale);
const image=new URL('../../webapp/assets/demo-vehicle-zeekr.jpg',location.href).href;
function render(){
 const locale=document.querySelector('#language').value,screen=document.querySelector('#screen').value,variant=document.querySelector('#variant').value;
 document.documentElement.lang=locale;
 const raw={job_id:'00000000-0000-0000-0000-000000000012',try_on_number:variant==='missing'?null:12,render_input_snapshot:{rim:{brand:'MUST NOT BE TITLE'}}};
 if(variant==='vehicle')raw.vehicle_identity={make:'Zeekr',model:'009',is_user_confirmed:true};
 const expected=variant==='vehicle'?'Zeekr 009':`${locale==='ru'?'Примерка':'Try-on'}${variant==='missing'?'':' #12'}`;
 const models=['homeRenderTitle','historyGalleryTitle','accountTryOnTitle'].map(fn=>title(raw,locale,fn));
 if(models.some(t=>t!==expected))throw Error('Title mismatch');
 const job={locale,jobId:raw.job_id,title:models[2],vehicleConfirmed:variant==='vehicle',status:'completed',imageUrl:image,thumbnailUrl:image,originalUrl:image,resultUrl:image,canOpen:true,createdLabel:'23.10.2026',historyCreatedLabel:'23.10.2026',reasons:[]};
 let view;
 if(screen==='home')view=createDashboardView({locale,authenticated:true,balance:29,balanceLabel:'29',expiry:[],latest:job,recent:[job]});
 else view=createRenderView(screen==='history'?'history':'result',screen==='history'?{locale,rows:[job]}:job);
 document.querySelector('#view').replaceChildren(view);
 if(screen!=='home')for(let n=0;n<5;n++)refreshRenderView(view,screen==='history'?{locale,rows:[job]}:job);
 if(!view.textContent.includes(expected))throw Error('Rendered title missing');
 if(screen==='history'&&!view.querySelector('a').getAttribute('href').endsWith(raw.job_id))throw Error('UUID route changed');
 document.querySelector('#checks').textContent=`PASS · ${locale} · ${screen} · ${expected}`;
}
for(const el of document.querySelectorAll('select'))el.onchange=render;
render();
</script></body></html>
