<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog handoff — local acceptance</title>
<link rel="stylesheet" href="../../webapp/style.css"><link rel="stylesheet" href="../../webapp/vnext/styles/tokens.css"><link rel="stylesheet" href="../../webapp/vnext/styles/foundation.css"><link rel="stylesheet" href="../../webapp/vnext/styles/shell.css"><link rel="stylesheet" href="../../webapp/vnext/styles/surfaces.css"><link rel="stylesheet" href="../../webapp/vnext/styles/approved-home-create.css">
<style>body{margin:0;background:#080e10;color:#eef1f2}.qa-controls{padding:12px;font:14px sans-serif;display:flex;gap:12px;flex-wrap:wrap}.qa-controls button{padding:8px}#qa-status{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><nav class="qa-controls"><button id="reset">Восстановить конфликт</button><button id="reload-draft">Восстановить черновик</button><button id="switch-locale">RU / EN</button><label>Image mode <select id="qa-image-mode"><option value="normal">Normal</option><option value="slow">Delayed success</option><option value="error">Delayed error</option></select></label><button id="qa-finish">Завершить загрузку</button><label><input id="qa-redraw-loop" type="checkbox">Periodic redraw</label><span id="qa-status" role="status">Загрузка локального сценария</span></nav><main id="app"><section data-view="create"></section></main>
<script type="module">
const source=(await(await fetch('../../webapp/app.js')).text()).replaceAll('from "./',`from "${location.origin}/webapp/`).replace('"dream-wheels-upload-draft"','"dream-wheels-catalog-local-qa"');
const setup=`
state.view="create";state.frontendAuthState={status:"AUTHENTICATED",principalVerified:true,protectedApiReady:true,authority:"supabase"};state.frontendAuthUser={id:"local-qa",email:"local@example.test"};
const qaFetch=window.fetch.bind(window);let qaWrites=0;
window.fetch=async(url,options={})=>{if(options.method && options.method!=="GET"){qaWrites++;throw Error("Local fixture blocks API writes");}return qaFetch(url,options);};
catalogHandoff.isReady=()=>true;
let qaImageRequest=null;
catalogHandoff.fetchImage=(url,options)=>{
 const load=()=>window.fetch("/qa-catalog/"+new URL(url).pathname.split("/catalog-wheels/")[1],options);
 if(document.querySelector('#qa-image-mode').value==='normal')return load();
 return new Promise((resolve,reject)=>{qaImageRequest=()=>document.querySelector('#qa-image-mode').value==='error'?reject(Error('Controlled image failure')):load().then(resolve,reject);setTimeout(()=>{const request=qaImageRequest;qaImageRequest=null;request?.();},3500);});
};
document.querySelector('#qa-finish').onclick=()=>{const request=qaImageRequest;qaImageRequest=null;request?.();};
let qaRedrawTimer;
document.querySelector('#qa-redraw-loop').onchange=event=>{clearInterval(qaRedrawTimer);if(event.target.checked)qaRedrawTimer=setInterval(()=>notifyCreateBridge(),100);};
const qaSnapshot=window.dreamwheelsCreateBridge.snapshot;
window.dreamwheelsCreateBridge.snapshot=()=>{
 const snapshot=qaSnapshot();const selection=snapshot.catalogHandoff?.selection;
 if(selection)selection.thumbnail=location.origin+"/landing/public"+selection.imageAsset.previews["640"].landingPath;
 return snapshot;
};
const {catalogEntries:qaCatalog}=await import(location.origin+"/webapp/vnext/catalog-data.mjs");
const qaEntry=qaCatalog.find(e=>e.selectedSkuId);
async function qaReset(){
 catalogHandoff.cancel();
 const entries=[];
 for(const [kind,path] of [["car","photo-guide-car.jpg"],["wheel","demo-rim-xtrike.png"]]){
  const blob=await(await qaFetch(location.origin+"/webapp/assets/"+path)).blob();entries.push({kind,file:{name:path,size:blob.size,type:blob.type},bytes:await blob.arrayBuffer()});
 }
 await saveDraftFiles(entries);state.files={car:null,wheel:null};state.catalogWheel=null;await hydrateFilesFromDraft();
 captureCatalogHandoff(new URL(location.origin+"/new?catalog_variant="+qaEntry.variantId+"&catalog_sku="+qaEntry.selectedSkuId+"&catalog_locale=ru&catalog_source=catalog"),catalogHandoff.storage);
 await catalogHandoff.resume();renderCreateInputs();
}
document.querySelector('#reset').onclick=qaReset;
document.querySelector('#reload-draft').onclick=async()=>{state.files={car:null,wheel:null};state.catalogWheel=null;await hydrateFilesFromDraft();await catalogHandoff.resume();renderCreateInputs();};
document.querySelector('#switch-locale').onclick=()=>window.dispatchEvent(new CustomEvent('dreamwheels:localechange',{detail:{locale:locale==='ru'?'en':'ru'}}));
await qaReset();
const qaParams=new URLSearchParams(location.search);
if(['ru','en'].includes(qaParams.get('qa_locale')))locale=qaParams.get('qa_locale');
if(['image','timeout','storage','invalid','unavailable'].includes(qaParams.get('qa_error')))catalogHandoff.error=qaParams.get('qa_error');
notifyCreateBridge();
setInterval(()=>document.querySelector('#qa-status').textContent=JSON.stringify({wheel:state.catalogWheel?resolveCatalogSelection(state.catalogWheel)?.sku.sku:"manual",pending:Boolean(catalogHandoff.pending),car:state.files.car?.name,apiWrites:qaWrites}),100);
`;
try { await import(URL.createObjectURL(new Blob([source+'\n'+setup],{type:'text/javascript'})));await import('../../webapp/vnext/bootstrap.js?catalog-qa=storage-1');window.dispatchEvent(new CustomEvent('dreamwheels:viewchange',{detail:{view:'create'}})); }
catch(error){document.querySelector('#qa-status').textContent='FAIL: '+error.stack;}
</script></body></html>
